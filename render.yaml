services:
  - type: web
    name: ttb-label-verification
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TIMEOUT_SECONDS
        value: "4.25"
      - key: OPENAI_IMAGE_DETAIL
        value: low
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "300"
      - key: IMAGE_MAX_SIDE
        value: "1280"
      - key: IMAGE_MAX_BYTES
        value: "1000000"
      - key: MAX_BATCH_LABELS
        value: "10"
      - key: MAX_BATCH_CONCURRENCY
        value: "4"
